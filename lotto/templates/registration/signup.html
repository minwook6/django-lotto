<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로또 시스템 회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow" style="width: 400px;">
        <div class="card-header bg-dark text-white text-center">
            <h5 class="mb-0">📝 로또 시스템 회원가입</h5>
        </div>
        <div class="card-body p-4">
            {% if form.errors %}
                <div class="alert alert-danger small py-2" role="alert">
                    입력 정보를 다시 확인해 주세요. (비밀번호 규칙 등)
                </div>
            {% endif %}
            <form method="post" action="{% url 'signup' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark w-100 fw-bold mt-2">가입하기</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-decoration-none small text-muted">이미 계정이 있으신가요? 로그인</a>
            </div>
        </div>
    </div>
</body>
</html>
